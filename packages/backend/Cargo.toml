[package]
name = "organizer"
version = "1.0.0"
edition = "2024"
# `cargo run` without --bin: the server.
default-run = "organizer"

[dependencies]
# The server key over the storage backends' secrets (src/backends.rs):
# AES-256-GCM, the crate the end-to-end crypto crate already uses.
aes-gcm = "0.11.1"
# The binaries' errors (main, the spec writer, the healthcheck), with context.
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
axum-login = "0.18.0"
blake3 = "1.8.7"
bytes = "1.12.1"
dav-server = { version = "0.11.0", default-features = false, features = ["localfs"] }
ed25519-dalek = "=3.0.0"
futures-core = "0.3.31"
genai = { version = "0.7.3", default-features = false }
globset = "0.4.21"
governor = "0.10.4"
hex = "0.4.3"
httpsig = "=0.0.26"
jiff = "0.2.39"
lol_html = "3.0.3"
mime_guess = "2.0.5"
notify = "8.2.1"
# The storage layer of every drive (src/storage.rs, docs/M7C_DESIGN.md §4):
# the server's disk and S3-compatible backends. Already built in through
# rustic_backend at this version, with its default features (so turning
# them off here would build nothing less).
opendal = { version = "0.59.5", features = ["services-fs", "services-s3", "services-webdav"] }
# Single sign-on (src/oidc.rs). Without its default features: it would bring
# reqwest 0.12; our own reqwest is handed to it instead.
openidconnect = { version = "4.1.0", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "multipart", "rustls-no-provider"] }
rust-embed = "8.13.0"
# Backups (src/backup): the library under the rustic command, restic-format
# repositories. The opendal backend only: a local path or S3.
rustic_backend = { version = "0.7.0", default-features = false, features = ["opendal"] }
rustic_core = "0.13.0"
# TLS for reqwest (the provider's endpoints) with ring, which builds for
# musl; installed as the process default in lib.rs.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# SQLite only (bundled, so the static musl build needs no system library); no
# TLS or other drivers. Queries are checked at run time: `sqlx::query`, never
# the `query!` macros, which need a database at compile time.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "uuid"] }
# The API's typed error (src/error.rs).
thiserror = "2.0.21"
# tower-sessions' expiry times are `time`'s; the app itself uses jiff.
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.53.2", features = ["full"] }
# Two-factor authentication (src/totp.rs). `otpauth` for the URI the apps scan.
totp-rs = { version = "6.0.0", features = ["otpauth"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tower-sessions = { version = "0.14.0", default-features = false, features = ["axum-core"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
turso = { version = "0.8.3", default-features = false }
unicode-normalization = "0.1.25"
# The OpenAPI spec (see src/openapi.rs): derives on the request and response
# types and a path annotation on every handler. The `openapi` binary writes
# it to a file; the server serves it only with SWAGGER_UI set.
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
# Push notifications (src/push.rs): the encrypted Web Push request and its
# VAPID signature; its re-exports (jwt-simple, p256) also sign the APNs token.
web-push-native = "0.5.0"
webauthn-rs = { version = "0.6.2", features = ["conditional-ui", "danger-allow-state-serialisation"] }
xberg = { version = "1.3.10", default-features = false, features = ["tokio-runtime", "pdf", "office", "excel", "html"] }
# Folders of public links downloaded as a zip (src/routes/links.rs). Already
# built in through xberg, at this version and with these features: no new crate.
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# The tests' stand-in APNs speaks HTTP/2 (h2c); hyper's http2 is in the tree already.
axum = { version = "0.8.9", features = ["http2"] }
axum-test = "21.1.0"
# The tests' stand-in single sign-on provider: openidconnect's ID token
# claims take chrono times. The app itself uses jiff.
chrono = "0.4.45"
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }

[features]
# Builds without packages/frontend/dist, for the `openapi` binary only (never ship it):
# the frontend client is generated from the spec, so the spec comes first.
spec = []

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"
required-features = ["spec"]

# No unsafe code, ever: not even an `allow` can lift a `forbid`.
[lints.rust]
unsafe_code = "forbid"

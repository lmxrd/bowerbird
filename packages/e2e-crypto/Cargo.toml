[package]
name = "organizer-e2e-crypto"
version = "0.0.0"
description = "End-to-end-encrypted folders: the reference implementation of docs/E2E_SPEC.md, and organizer-decrypt"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
base32 = "0.5.1"
base64 = "0.23.1"
curve25519-dalek = "5.0.0"
hex = "0.4.3"
hkdf = "0.13.0"
pbkdf2 = "0.13.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
# The tests run organizer-decrypt against the server, in-process, and its database.
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
organizer = { path = "../backend" }

# No unsafe code, as in the backend.
[lints.rust]
unsafe_code = "forbid"

[package]
name = "organizer-sync"
version = "0.0.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.1"
futures-core = "0.3.31"
jiff = "0.2.39"
notify = "8.2.1"
organizer-cloudfiles = { version = "0.0.0", path = "../cloudfiles" }
organizer-e2e-crypto = { version = "0.0.0", path = "../e2e-crypto" }
progenitor-client = "0.15.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream", "query", "multipart"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
trash = "5.3.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[build-dependencies]
prettyplease = "0.2.37"
progenitor = { version = "0.15.1", default-features = false }
serde_json = "1.0.151"
syn = { version = "2.0.119", features = ["full"] }

[dev-dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
organizer = { path = "../backend" }

# No unsafe code, as in the backend.
[lints.rust]
unsafe_code = "forbid"

# The desktop app's File Provider extension for macOS (docs/M5B_DESIGN.md
# §2), and the small tool the app runs to add, remove and signal its
# domains (`organizer-fileprovider`), both on OrganizerKit (apps/ios,
# the iOS app's Swift package: one Swift client for both). Here, beside the
# Tauri app whose bundle they go in, rather than beside the iOS project:
# they ship with the desktop app, are built by its `build:desktop`
# (scripts/build.sh, from Tauri's beforeBundleCommand), and are copied into
# its bundle by src-tauri/tauri.macos.conf.json.
#
# Generated, not committed: OrganizerFileProvider.xcodeproj, and the
# Info.plist and entitlements files XcodeGen writes from here.
#
# SIGNING: a File Provider extension does not load until the app, the
# extension and the tool are signed with an Apple team and these
# entitlements (the system ignores an unsigned one). Set DEVELOPMENT_TEAM
# below to your team's id (a free account's Personal Team runs it on your
# own Mac; a Developer ID, notarised, gives it to others), CODE_SIGN_STYLE
# to Automatic and CODE_SIGN_IDENTITY to "Apple Development" (or
# "Developer ID Application"), and sign the Tauri app with the same team
# (bundle.macOS.signingIdentity). scripts/build.sh signs when a team is set.
name: OrganizerFileProvider
options:
  bundleIdPrefix: eu.vardalabs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Arm and Intel Macs alike, as the app's .dmg.
    ONLY_ACTIVE_ARCH: NO

packages:
  OrganizerKit:
    path: ../../ios/Sources/OrganizerKit

targets:
  OrganizerFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: FileProvider
    dependencies:
      # The static product: an extension and a tool have no Frameworks
      # folder to share a dynamic one in.
      - package: OrganizerKit
        product: OrganizerKitStatic
    settings:
      base:
        # Within the app's identifier, as an extension's must be.
        PRODUCT_BUNDLE_IDENTIFIER: eu.vardalabs.organizer.desktop.fileprovider
        PRODUCT_NAME: OrganizerFileProvider
    info:
      path: FileProvider/Info.plist
      properties:
        CFBundleDisplayName: Organizer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: $(TeamIdentifierPrefix)eu.vardalabs.organizer.desktop
    entitlements:
      path: FileProvider/FileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)eu.vardalabs.organizer.desktop
        # The session the tool keeps (DesktopSession): the default access
        # group, the first of these.
        keychain-access-groups:
          - $(AppIdentifierPrefix)eu.vardalabs.organizer.desktop

  organizer-fileprovider:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    dependencies:
      - package: OrganizerKit
        product: OrganizerKitStatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.vardalabs.organizer.desktop.helper
        PRODUCT_NAME: organizer-fileprovider
    entitlements:
      path: Helper/Helper.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)eu.vardalabs.organizer.desktop
        keychain-access-groups:
          - $(AppIdentifierPrefix)eu.vardalabs.organizer.desktop

schemes:
  OrganizerFileProvider:
    build:
      targets:
        OrganizerFileProvider: all
        organizer-fileprovider: all

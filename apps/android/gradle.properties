org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Gradle's build cache (~/.gradle/caches/build-cache-1): task outputs are
# kept once and reused across worktrees and clean builds, so `clean` is cheap.
# Gradle drops entries unused for 7 days.
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
